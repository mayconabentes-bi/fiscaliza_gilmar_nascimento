name: Preflight de isolamento - testes sinteticos

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/staging-isolation-preflight.yml"
      - "scripts/verify-staging-destinations.mjs"
      - "tests/staging-destinations.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-preflight:
    name: Nega destinos errados sem ler segredos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testar apenas fixtures ficticias
        run: node --test tests/staging-destinations.test.mjs
