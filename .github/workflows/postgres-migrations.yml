name: PostgreSQL migration smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'tests/postgres-migrations-smoke.mjs'
      - '.github/workflows/postgres-migrations.yml'
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'tests/postgres-migrations-smoke.mjs'
      - '.github/workflows/postgres-migrations.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgres-migrations-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema-smoke:
    name: Apply migrations from zero
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fiscalize_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fiscalize_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/fiscalize_qa
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Apply every migration and validate security invariants
        run: node tests/postgres-migrations-smoke.mjs
