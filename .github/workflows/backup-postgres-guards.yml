name: Backup PostgreSQL encrypted - guard tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/backup_postgres_encrypted.py"
      - "tests/test_backup_postgres_encrypted.py"
      - ".github/workflows/backup-postgres-guards.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Static syntax check
        run: python -m py_compile scripts/backup_postgres_encrypted.py tests/test_backup_postgres_encrypted.py
      - name: Synthetic tests - no DB, no secrets
        run: python -m unittest discover -s tests -p test_backup_postgres_encrypted.py -v
