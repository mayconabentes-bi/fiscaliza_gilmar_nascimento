name: Normalize repository source

on:
  push:
    branches:
      - chore/fiscalize-source-normalization

permissions:
  contents: write

concurrency:
  group: normalize-fiscalize-source
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand source package and normalize repository
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f fiscaliza_gilmar_nascimento.zip ]; then
            echo "Source package already removed; normalization is complete."
            exit 0
          fi

          rm -rf .normalize-tmp
          mkdir -p .normalize-tmp
          unzip -q fiscaliza_gilmar_nascimento.zip -d .normalize-tmp

          SOURCE_DIR="$(find .normalize-tmp -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          if [ -z "$SOURCE_DIR" ] || [ ! -f "$SOURCE_DIR/package.json" ] || [ ! -d "$SOURCE_DIR/src" ]; then
            echo "Unexpected source package structure" >&2
            exit 1
          fi

          cp -a "$SOURCE_DIR"/. ./
          rm -rf .normalize-tmp .fiscalize-import

          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path('.')
          excluded_parts = {'.git', 'node_modules', 'dist', 'dist-server'}

          for path in root.rglob('*'):
              if not path.is_file() or any(part in excluded_parts for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue

              original = text
              text = text.replace('Amazonas +Participativa', 'FISCALIZE - VOCÊ CUIDANDO DA CIDADE')
              text = text.replace('Amazonas Participativa', 'FISCALIZE - VOCÊ CUIDANDO DA CIDADE')
              text = text.replace('amazonas-participativa', 'fiscalize-voce-cuidando-da-cidade')
              # Replace only the standalone public brand. Internal compatibility tokens
              # such as getPulsoAttribution, --pulso-*, localStorage keys and custom
              # event names remain untouched to avoid behavioral regressions.
              text = re.sub(r'(?<![A-Za-z0-9_])Pulso(?![A-Za-z0-9_])', 'FISCALIZE', text)
              text = text.replace('@pulso.local', '@fiscalize.local')

              if text != original:
                  path.write_text(text, encoding='utf-8')

          readme = root / 'README.md'
          if readme.exists():
              text = readme.read_text(encoding='utf-8')
              text = re.sub(r'^#\s+FISCALIZE\s*$', '# FISCALIZE - VOCÊ CUIDANDO DA CIDADE', text, count=1, flags=re.M)
              readme.write_text(text, encoding='utf-8')

          index = root / 'index.html'
          if index.exists():
              text = index.read_text(encoding='utf-8')
              text = re.sub(
                  r'<meta name="description" content="[^"]*"\s*/>',
                  '<meta name="description" content="FISCALIZE - VOCÊ CUIDANDO DA CIDADE. Plataforma cívica independente para registrar e acompanhar problemas urbanos em Manaus." />',
                  text,
              )
              text = re.sub(r'<title>.*?</title>', '<title>FISCALIZE | Você cuidando da cidade</title>', text)
              index.write_text(text, encoding='utf-8')

          metadata = root / 'metadata.json'
          if metadata.exists():
              data = json.loads(metadata.read_text(encoding='utf-8'))
              data['name'] = 'FISCALIZE - VOCÊ CUIDANDO DA CIDADE'
              data['description'] = 'Plataforma cívica independente para registrar, organizar e acompanhar problemas urbanos em Manaus.'
              metadata.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          gitignore = root / '.gitignore'
          text = gitignore.read_text(encoding='utf-8') if gitignore.exists() else ''
          additions = ['*.zip', '.fiscalize-import/']
          missing = [item for item in additions if item not in text.splitlines()]
          if missing:
              text = text.rstrip() + '\n\n# Artefatos de transporte/importação\n' + '\n'.join(missing) + '\n'
              gitignore.write_text(text, encoding='utf-8')

          for obsolete in (
              'COMANDOS_PUBLICAR_GITHUB.ps1',
              'COMANDOS_PUBLICAR_GITHUB.sh',
              'README_PUBLICACAO_GITHUB.md',
              'fiscaliza_gilmar_nascimento.zip',
          ):
              path = root / obsolete
              if path.exists():
                  path.unlink()
          PY

      - name: Verify repository shape
        shell: bash
        run: |
          set -euo pipefail
          test -d src
          test -d tests
          test -d docs
          test -d supabase/migrations
          test -f api/index.ts
          test -f package.json
          test -f package-lock.json
          test ! -f fiscaliza_gilmar_nascimento.zip
          test ! -d .fiscalize-import
          if grep -R -n -E 'Amazonas \+Participativa|Amazonas Participativa|amazonas-participativa' --exclude-dir=.git --exclude-dir=node_modules .; then
            echo "Legacy project name still found" >&2
            exit 1
          fi

      - name: Commit normalized source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "No repository changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: normaliza código-fonte do FISCALIZE"
          git push origin HEAD:chore/fiscalize-source-normalization
