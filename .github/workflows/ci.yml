name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - feat/intelligence-api-core

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p0-validate:
    name: P0 jurídico — build, lint, legal, persistência, mobile, go-live e segurança
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DPO_CONTACT_EMAIL: privacidade-ci@fiscalize.local
      LGPD_CONSENT_VERSION: 2026-09-v2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript validation
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Legal P0 contract
        run: npm run test:legal-p0
      - name: Legal P0-C boundary
        run: npm run test:legal-p0c
      - name: Legal P0-E readiness
        run: npm run test:legal-p0e
      - name: P0-E age policy technical contract
        run: npm run test:p0e-tech
      - name: Age intelligence statistics and privacy
        run: npm run test:age-intelligence
      - name: Demand taxonomy structure and validation
        run: npm run test:demand-taxonomy
      - name: Registration P0 hardening
        run: npm run test:registration-p0
      - name: Registration P1.1 idempotency
        run: npm run test:registration-idempotency
      - name: Registration P1.2 evidence resilience
        run: npm run test:registration-evidence-resilience
      - name: Registration P1.3 evidence magic bytes
        run: npm run test:registration-evidence-magic-bytes
      - name: Registration P1.4A image structure limits
        run: npm run test:registration-evidence-structure
      - name: Citizen account structure, age bands and CEP
        run: npm run test:citizen-account
      - name: Authenticated citizen experience
        run: npm run test:citizen-experience
      - name: QA restricted DB function static contract (no production access)
        run: node tests/citizen-qa-restricted-contract.mjs
      - name: Staging synthetic registration gate runtime (no external calls)
        run: npx tsx tests/qa-registration-gate-runtime.ts
      - name: P0-E age flow runtime
        run: npm run test:p0e-age-flow
      - name: P0-E data boundary
        run: npm run test:p0e-boundary
      - name: P0-D production persistence
        run: npm run test:p0d
      - name: CEP location contract
        run: npm run test:cep-location
      - name: Mobile UI contract
        run: npm run test:mobile-ui
      - name: Brand UI contract
        run: npm run test:brand-ui
      - name: Account recovery security contract
        run: npm run test:account-recovery
      - name: Citizen session revocation security
        run: npm run test:citizen-session-security
      - name: Multi-photo evidence contract
        run: npm run test:photo-evidence
      - name: Public journey refinement contracts
        run: |
          node tests/home-refinement-contract.mjs
          node tests/protocol-followup-contract.mjs
          node tests/safe-draft-contract.mjs
          node tests/visual-qa-contract.mjs
      - name: Responsive device matrix
        run: npm run test:devices
      - name: Mobile performance budget
        run: npm run test:performance
      - name: Go-live readiness smoke tests
        run: npm run test:go-live
      - name: Mobile conversion and public intake test
        run: npm run test:mobile
      - name: Private intelligence access attack contract
        run: npm run test:internal-access
      - name: T1 admin security attack suite
        run: npm run test:triage-admin-security
      - name: Sector scope access control (Fase 1)
        run: npm run test:sector-scope
      - name: Team management access control (Fase 1)
        run: npm run test:team-management
      - name: T2 triage record integrity
        run: npm run test:triage-record-integrity
      - name: T3 triage evidence integrity
        run: npm run test:triage-evidence-integrity
      - name: T3 evidence display CSP regression
        run: npm run test:triage-evidence-display
      - name: T4 triage status integrity
        run: npm run test:triage-status-integrity
      - name: Audit high and critical vulnerabilities
        run: npm run audit:high
      - name: External data transient classification contract
        run: node tests/real-data-availability-contract.mjs

  validate:
    name: Full QA, intelligence, backup and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DPO_CONTACT_EMAIL: privacidade-ci@fiscalize.local
      LGPD_CONSENT_VERSION: 2026-09-v2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript validation
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Legal P0-E readiness
        run: npm run test:legal-p0e
      - name: P0-E age policy technical contract
        run: npm run test:p0e-tech
      - name: Age intelligence statistics and privacy
        run: npm run test:age-intelligence
      - name: Demand taxonomy structure and validation
        run: npm run test:demand-taxonomy
      - name: Registration P1.1 idempotency
        run: npm run test:registration-idempotency
      - name: Registration P1.2 evidence resilience
        run: npm run test:registration-evidence-resilience
      - name: Registration P1.3 evidence magic bytes
        run: npm run test:registration-evidence-magic-bytes
      - name: Registration P1.4A image structure limits
        run: npm run test:registration-evidence-structure
      - name: Citizen account structure, age bands and CEP
        run: npm run test:citizen-account
      - name: Authenticated citizen experience
        run: npm run test:citizen-experience
      - name: P0-E age flow runtime
        run: npm run test:p0e-age-flow
      - name: P0-E data boundary
        run: npm run test:p0e-boundary
      - name: P0-D production persistence
        run: npm run test:p0d
      - name: CEP location contract
        run: npm run test:cep-location
      - name: Mobile UI contract
        run: npm run test:mobile-ui
      - name: Brand UI contract
        run: npm run test:brand-ui
      - name: Account recovery security contract
        run: npm run test:account-recovery
      - name: Citizen session revocation security
        run: npm run test:citizen-session-security
      - name: Multi-photo evidence contract
        run: npm run test:photo-evidence
      - name: Responsive device matrix
        run: npm run test:devices
      - name: Mobile performance budget
        run: npm run test:performance
      - name: Private admin bootstrap test
        run: npm run test:admin-bootstrap
      - name: Radar attack smoke tests
        run: npm run test:smoke
      - name: Intelligence API smoke tests
        run: npm run test:intelligence
      - name: Multi-source intelligence engine
        run: npm run test:intelligence-multisource
      - name: Advanced intelligence P9-P17
        run: npm run test:intelligence-advanced
      - name: PNCP retry and deduplication contract
        run: npm run test:pncp-resilience
      - name: PNCP HTTP 429 and Retry-After contract
        run: node tests/pncp-rate-limit.mjs
      - name: Official data source activation discovery
        run: npm run test:source-activation
      - name: Go-live readiness smoke tests
        run: npm run test:go-live
      - name: Real backup and restore test
        run: npm run test:backup
      - name: Mobile conversion and public intake test
        run: npm run test:mobile
      - name: Private intelligence access attack contract
        run: npm run test:internal-access
      - name: T1 admin security attack suite
        run: npm run test:triage-admin-security
      - name: Sector scope access control (Fase 1)
        run: npm run test:sector-scope
      - name: Team management access control (Fase 1)
        run: npm run test:team-management
      - name: T2 triage record integrity
        run: npm run test:triage-record-integrity
      - name: T3 triage evidence integrity
        run: npm run test:triage-evidence-integrity
      - name: T3 evidence display CSP regression
        run: npm run test:triage-evidence-display
      - name: T4 triage status integrity
        run: npm run test:triage-status-integrity
      - name: Audit high and critical vulnerabilities
        run: npm run audit:high
      - name: External data transient classification contract
        run: node tests/real-data-availability-contract.mjs
      - name: Deep QA with real public data
        run: |
          set -o pipefail
          npm run test:real-data 2>&1 | tee deep-qa.log
          if grep -q '^QA DEGRADED:' deep-qa.log; then
            echo '### Deep QA: fonte pública com disponibilidade reduzida' >> "$GITHUB_STEP_SUMMARY"
            echo 'As verificações de conteúdo real dessa fonte foram adiadas. Consulte os avisos nos logs e execute nova validação quando a API estiver disponível.' >> "$GITHUB_STEP_SUMMARY"
            echo '::warning title=Deep QA externo degradado::Verifique as fontes públicas temporariamente indisponíveis nos logs.'
          fi
