services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      CIVIC_DB_PATH: /data/civic_platform.db
      BACKUP_DIR: /data/backups-local
      BACKUP_EXTERNAL_DIR: /backups
      ENABLE_PUBLIC_REGISTRATION: ${ENABLE_PUBLIC_REGISTRATION:-true}
      ENABLE_PUBLIC_DEMAND_INTAKE: ${ENABLE_PUBLIC_DEMAND_INTAKE:-true}
    volumes:
      - app_data:/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  backup:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      CIVIC_DB_PATH: /data/civic_platform.db
      BACKUP_DIR: /data/backups-local
      BACKUP_EXTERNAL_DIR: /backups
    command: ["sh", "-c", "while true; do node dist-server/src/scripts/backup_once.js || true; sleep 86400; done"]
    volumes:
      - app_data:/data
      - ./backups:/backups
    depends_on:
      app:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  app_data:
  caddy_data:
  caddy_config:
